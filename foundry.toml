[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = 3000000000
fs_permissions = [{ access = "read", path = "./analysis/results" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64

[rpc_endpoints]
unichain_sepolia = "https://sepolia.unichain.org"
mainnet = "${MAINNET_RPC_URL}"
